syntax = "proto3";

option csharp_namespace = "HttpAndGrpcProductServices.Grpc";

import "google/api/annotations.proto";

package product;

service ProductService {
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse) {
    option (google.api.http) = { post: "/v1/products" body: "*" };
  }

  rpc GetProducts (GetProductsRequest) returns (GetProductsResponse) {
    option (google.api.http) = { get: "/v1/products" };
  }

  rpc GetProductById (GetProductByIdRequest) returns (GetProductByIdResponse) {
    option (google.api.http) = { get: "/v1/products/{id}" };
  }
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  double weight = 3;
  int32 type = 4;
  int32 warehouse_number = 5;
}

message CreateProductResponse {
  string id = 1;
}

message GetProductsRequest {
  string created_from = 1;
  string created_to = 2;
  optional int32 type = 3;
  optional int32 warehouse_number = 4;
  int32 page_number = 5;
  int32 page_size = 6;
}

message ProductMessage {
  string id = 1;
  string name = 2;
  double price = 3;
  double weight = 4;
  int32 type = 5;
  string created_at = 6;
  int32 warehouse_number = 7;
}

message GetProductsResponse {
  repeated ProductMessage items = 1;
  int32 total_count = 2;
}

message GetProductByIdRequest {
  string id = 1;
}

message GetProductByIdResponse {
  ProductMessage product = 1;
}